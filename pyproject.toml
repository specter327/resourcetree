[project]

name = "resourcetree"
version = "0.2.0"

description = "Generic hierarchical resource tree framework"

readme = "README.md"

requires-python = ">=3.11"


dependencies = [
    "uuid6"
]


[tool.setuptools.packages.find]

where = ["."]


[build-system]

requires=[
    "setuptools",
    "wheel"
]

build-backend="setuptools.build_meta"